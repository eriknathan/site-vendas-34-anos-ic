services:
  web:
    container_name: ${COMPOSE_PROJECT_NAME:-explosao-34-anos}-web
    build:
      context: .
      target: development
    command: npm run dev -- --hostname 0.0.0.0
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
